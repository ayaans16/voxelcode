# Runs voxelcode on the same Docker network as your existing Caddy ("infra_default"),
# so Caddy reaches it by name: reverse_proxy voxelcode:3000. No ports are published.
services:
  voxelcode:
    build: ..
    # Lets you build elsewhere and `docker load` the image; `never` stops compose
    # trying to pull "voxelcode" from Docker Hub.
    image: voxelcode:latest
    pull_policy: never
    container_name: voxelcode
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOXELCODE_NATIVE_RUNNER: "off"
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    # no-new-privileges is deliberately off: it makes exec fail ("operation not
    # permitted") under snap Docker's AppArmor profile.
    cap_drop:
      - ALL
    networks:
      infra_default:
        # Fixed address: Docker's built-in DNS is unreliable on this host, so Caddy
        # proxies to this IP instead of the name "voxelcode".
        ipv4_address: 172.18.0.250

networks:
  infra_default:
    external: true
